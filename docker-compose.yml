services:
  streamcache:
    build:
      context: https://${GITHUB_TOKEN}@github.com/bruor/GoStreamCache.git#main
    container_name: streamcache
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mounts the local ./cache folder into the container to persist media files
      - ./cache:/var/cache/streamcache
    environment:
      - PORT=8080
      - CACHE_DIR=/var/cache/streamcache/files
      - TMP_DIR=/var/cache/streamcache/tmp
      
      # Block & Buffer Configs
      - BLOCK_SIZE=4MB
      # Set to true to disable Fadvise page cache purging (allows OS to buffer writes in RAM, speeding up slow NAS writes)
      # - DISABLE_FADVISE=true
      
      # Cache eviction bounds (e.g. 50GB, 1TB, or 0/none/off/disabled to rely solely on disk free space)
      - CACHE_MAX_BYTES=50GB
      
      # Physical disk safety guard (minimum disk free space, e.g. 10GB)
      - MIN_DISK_FREE_BYTES=10GB
      
      # Debounced Scheduler bounds
      - SCHEDULER_MIN_BYTES=16MB
      - SCHEDULER_MIN_TIME=2s
      
      # Cache change validation period
      - CACHE_REVALIDATE_INTERVAL=1h
      
      # Timeout for stalled upstream reads (default is 0s / unlimited; uncomment and set e.g. 30s or 90s to tune down if needed)
      # - UPSTREAM_READ_TIMEOUT=30s
      
      # Maximum concurrent upstream downloader threads per VOD file
      - MAX_UPSTREAM_WORKERS=2
      
      # Duration the proxy waits for active hydration progress to catch up before spawning a new connection
      - CLIENT_HYDRATION_WAIT=2s
      
      # Cooldown durations for upstream probe failures
      - PROBE_FAILURE_COOLDOWN=10m
      - PROBE_TRANSIENT_COOLDOWN=30s
      
      # Upstream User-Agent Spoofing & Anti-Throttling Configs
      # Mode options: smart (recommended; rewrites Lavf/FFmpeg/Unknown), force (always override), passthrough (fallback if empty)
      - UPSTREAM_USER_AGENT_MODE=smart
      - UPSTREAM_USER_AGENT=VLC/3.0.20 LibVLC/3.0.20
      
      # Option to restrict domains allowed through the proxy (comma-separated list)
      # - ALLOWED_HOSTS=infinity.gives

